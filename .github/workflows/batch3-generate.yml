name: Batch3 compile 30 archive pages (ISOLATED / NO LIVE PUBLISH)
on:
  push:
    branches: [archive/batch3-fast-20261104]
    paths: ['.github/workflows/batch3-generate.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/archive/batch3-fast-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/batch3-fast-20261104
          persist-credentials: true
      - name: Prepare fully source-verified historical records
        run: |
          python3 research/prepare_next30.py
          python3 - <<'PY'
          import json
          j=json.load(open('research/batch3_preparation_report.json'))
          assert j['ready']==30 and j['not_ready']==0, f"Failed original text/cover checks: {j['entries']}"
          print("30/30 original articles validated")
          PY
      - name: Rebuild native HTML archive on isolated branch only
        run: |
          set -e
          python3 - <<'PY' >/tmp/hpi-batch3-slugs.txt
          import json
          j=json.load(open('research/batch3_preparation_report.json'))
          print('\n'.join(x['slug'] for x in j['entries'] if x['status']=='ready'))
          PY
          while read -r slug; do
            test -n "$slug" || continue
            python3 scripts/publish_approved_article.py "$slug"
            python3 scripts/publish_approved_article.py "$slug" --publish
          done </tmp/hpi-batch3-slugs.txt
      - name: Verify originals, metadata, rubrics and SEO invariants
        run: |
          python3 scripts/build_rubrics.py --check
          python3 scripts/build_home_published.py --check
          python3 scripts/build_sitemap.py --check
          python3 -m unittest discover -s tests -p 'test_archival_batch3.py' -v
          python3 -m unittest discover -s tests -p 'test_historical_batch.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_publisher.py' -v
          python3 -m unittest discover -s tests -p 'test_search_indexing.py' -v
          python3 -m unittest discover -s tests -p 'test_site_rubrics_related.py' -v
          python3 -m unittest discover -s tests -p 'test_homepage.py' -v
      - name: Save build report and files as recovery artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: batch3-site-generated
          path: |
            research/batch3_preparation_report.json
            content/approved/*.json
            articles/**/index.html
            rubrics/**/index.html
            news.json
            feed.xml
            sitemap.xml
            index.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit verified files on archive branch only (NOT main)
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/batch3_preparation_report.json content/approved/ articles/ rubrics/ news.json sitemap.xml feed.xml index.html
          if ! git diff --cached --quiet; then
            git commit -m 'archive: generate third set of 30 original-date full HTML articles'
            git pull --rebase origin archive/batch3-fast-20261104
            git push origin HEAD:archive/batch3-fast-20261104
          fi
