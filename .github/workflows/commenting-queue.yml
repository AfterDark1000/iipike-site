name: HPII — comment drafts (MANUAL POSTING ONLY)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['HPII — watchdog (no publishing)']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/commenting_queue.py'
      - 'scripts/commenting_recovery.cjs'
      - 'scripts/first_car_commenting.py'
      - 'data/commenting_sources.json'
      - 'admin/commenting/**'
      - '.github/workflows/commenting-queue.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/commenting_queue.py'
      - 'scripts/commenting_recovery.cjs'
      - 'scripts/first_car_commenting.py'
      - 'data/commenting_sources.json'
      - 'admin/commenting/**'
      - 'admin/index.html'
      - 'tests/test_commenting_queue.py'
      - 'tests/test_first_car_commenting.py'
      - 'tests/commenting.test.cjs'
      - 'tests/commenting_recovery.test.cjs'
      - '.github/workflows/commenting-queue.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    # GitHub filters workflow_run by branch, but not by its original event.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_commenting_queue.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_first_car_commenting.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_admin_dashboard.py' -v
      - run: node --test tests/commenting.test.cjs tests/commenting_recovery.test.cjs
      - run: node --check admin/commenting/app.js
  update-queue:
    # A push tests the hotfix. Only schedule, recovery or an explicit dispatch can collect.
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["schedule", "workflow_dispatch", "workflow_run"]'), github.event_name)
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: hpii-commenting-queue
      cancel-in-progress: false
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read previous queue without changing publication branches
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { claimRecovery, readQueue } = require('./scripts/commenting_recovery.cjs');
            let previous;
            if (context.eventName === 'workflow_run') {
              previous = await claimRecovery({github, context, core});
              if (previous === null) return;
            } else {
              try {
                previous = await readQueue(github, context.repo, 'commenting-data');
              } catch (e) {
                if (e.status !== 404) throw e;
                previous = '{}';
              }
            }
            fs.writeFileSync('_commenting_previous.json', previous);
            core.setOutput('collect', true);
      - name: Read optional First Car input
        if: steps.state.outputs.collect == 'true' && vars.FIRST_CAR_DZEN_COLLECTION == 'enabled'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            async function read(path, ref) {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref });
              if (data.encoding !== 'base64' || typeof data.content !== 'string') throw Error('Invalid queue file');
              return Buffer.from(data.content, 'base64');
            }
            try {
              const discovery = await read('dzen/queue.json', 'first-car-data');
              let drafts = '{}';
              try { drafts = await read('first-car/drafts.json', 'commenting-data'); }
              catch (error) { if (error.status !== 404) throw error; }
              fs.writeFileSync('_first_car_previous.json', drafts);
              fs.writeFileSync('_first_car_discovery.json', discovery);
            } catch (error) {
              if (error.status !== 404) core.warning('First Car input unavailable; continuing with publisher RSS.');
            }
      - name: Read public publisher feeds and prepare at most three drafts
        if: steps.state.outputs.collect == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRST_CAR_ARTICLE_TEXT: ${{ vars.FIRST_CAR_DZEN_ARTICLE_TEXT }}
        run: |
          if [ -s _first_car_discovery.json ]; then
            python3 -m scripts.first_car_commenting --state _commenting_previous.json --output _commenting_queue.json \
              --discovery _first_car_discovery.json --drafts-state _first_car_previous.json --drafts-output _first_car_drafts.json
          else
            python3 scripts/commenting_queue.py --state _commenting_previous.json --output _commenting_queue.json
          fi
      - name: Save only queue metadata and drafts to dedicated data branch
        if: steps.state.outputs.collect == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('_commenting_queue.json', 'utf8');
            const queue = JSON.parse(content);
            if (queue.schema_version !== 1 || !Array.isArray(queue.items)) throw Error('Invalid generated queue');
            const ref = 'heads/commenting-data';
            let head = null, base = null;
            try {
              head = (await github.rest.git.getRef({...context.repo, ref})).data.object.sha;
              base = (await github.rest.git.getCommit({...context.repo, commit_sha:head})).data.tree.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            const files = [{path:'commenting/queue.json',mode:'100644',type:'blob',content}];
            if (fs.existsSync('_first_car_drafts.json')) {
              try {
                const drafts = fs.readFileSync('_first_car_drafts.json', 'utf8');
                const parsed = JSON.parse(drafts);
                if (parsed.schema_version !== 1 || !Array.isArray(parsed.items)) throw Error('Invalid First Car drafts');
                files.push({path:'first-car/drafts.json',mode:'100644',type:'blob',content:drafts});
              } catch {
                core.warning('First Car drafts unavailable; saving publisher queue.');
              }
            }
            const tree = await github.rest.git.createTree({...context.repo, ...(base ? {base_tree:base} : {}), tree:files});
            const commit = await github.rest.git.createCommit({...context.repo,
              message:'commenting: refresh public feed observations and manual comment drafts',
              tree:tree.data.sha, parents:head ? [head] : []});
            if (head) await github.rest.git.updateRef({...context.repo,ref,sha:commit.data.sha,force:false});
            else await github.rest.git.createRef({...context.repo,ref:'refs/'+ref,sha:commit.data.sha});
            const errors = queue.sources.filter(s => s.status !== 'ok').length;
            await core.summary.addHeading('Очередь комментариев').addRaw(
              'Статей: '+queue.items.length+' · ошибок источников: '+errors+
              ' · генерация: '+queue.generator.status+'\n\n'+
              'Комментарии не отправлены. Очередь: https://iipike.ru/admin/commenting/').write();
            if (errors) core.warning('Some publisher feeds could not be checked; see queue diagnostics.');
            if (!['ok','idle','daily_limit'].includes(queue.generator.status)) core.warning(queue.generator.message);
