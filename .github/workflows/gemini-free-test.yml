name: Test free Gemini API (no publishing)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/gemini_probe.py'
      - 'tests/test_gemini_probe.py'
      - '.github/workflows/gemini-free-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline safety tests (no key/no API calls)
        run: |
          python3 -m py_compile scripts/gemini_probe.py
          python3 -m unittest discover -v -s tests -p 'test_gemini_probe.py'
      - name: Real free-tier model request (manual launch only)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/gemini_probe.py
      - name: Save private test result as workflow artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gemini-editorial-test
          path: _test_output/gemini_probe.json
          if-no-files-found: error
          retention-days: 7
