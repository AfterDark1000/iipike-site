name: HPII ChatGPT site-first inbox safety (NO PUBLICATION)
on:
  pull_request:
    branches: [main]
    paths:
      - 'editorial_inbox/**'
      - 'scripts/site_first_inbox.py'
      - 'scripts/site_rich_text.py'
      - 'scripts/site_topics.py'
      - 'scripts/site_topic_registry.py'
      - 'scripts/check_topic_registry.py'
      - 'data/topic_extensions.json'
      - 'tests/test_site_topic_registry.py'
      - 'scripts/build_topics.py'
      - 'scripts/build_sitemap.py'
      - 'tests/test_search_indexing.py'
      - 'scripts/upgrade_article_navigation.py'
      - 'tests/test_site_topics.py'
      - '.github/workflows/topic-navigation-upgrade.yml'
      - 'scripts/site_related.py'
      - 'scripts/publish_approved_article.py'
      - 'scripts/historical_header_cleanup.py'
      - 'tests/test_historical_header_cleanup.py'
      - '.github/workflows/historical-header-cleanup.yml'
      - 'assets/site.css'
      - 'scripts/site_first_release_pr.py'
      - 'scripts/site_publication_queue.py'
      - 'tests/test_site_publication_queue.py'
      - '.github/workflows/site-first-scheduled-release.yml'
      - 'scripts/sync_site_first_dzen.py'
      - 'tests/test_sync_site_first_dzen.py'
      - '.github/workflows/site-first-dzen-links.yml'
      - 'tests/test_site_rich_text.py'
      - 'tests/test_approved_publisher.py'
      - 'tests/test_site_first_inbox.py'
      - 'tests/test_site_first_release_pr.py'
      - '.github/workflows/site-first-release-pr.yml'
      - '.github/workflows/site-first-inbox-safety.yml'
permissions:
  contents: read
jobs:
  validate-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install only local image validation library
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Check safe editor-to-site handoff
        run: |
          python3 -m py_compile scripts/site_first_inbox.py scripts/site_rich_text.py
          python3 scripts/check_topic_registry.py --base-sha "${{ github.event.pull_request.base.sha }}"
          python3 -m unittest discover -s tests -p 'test_site_topic_registry.py' -v
          python3 -m unittest discover -s tests -p 'test_site_first_inbox.py' -v
          python3 -m unittest discover -s tests -p 'test_site_rich_text.py' -v
          python3 -m unittest discover -s tests -p 'test_site_topics.py' -v
          python3 -m unittest discover -s tests -p 'test_sync_site_first_dzen.py' -v
          python3 -m unittest discover -s tests -p 'test_site_first_release_pr.py' -v
          python3 -m unittest discover -s tests -p 'test_site_publication_queue.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_publisher.py' -v
          python3 -m unittest discover -s tests -p 'test_historical_header_cleanup.py' -v
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      # Inbox audit is for unshipped editorial records. A release PR already
      # includes its new page in news.json, so duplicate detection intentionally
      # rejects it there. That same page was verified by the release builder,
      # and the full site's safety checks run separately on this PR.
      - name: Audit independent story and cover inbox without publishing
        if: ${{ !startsWith(github.head_ref, 'site-first/release/') }}
        run: python3 scripts/site_first_inbox.py --audit
      - name: Smoke test full site-first release in disposable CI workspace only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('.')
          slug='site-first-ci-smoke-20261104'
          old=len(json.loads((root/'news.json').read_text(encoding='utf-8')))
          Path('/tmp/site-first-old-count').write_text(str(old))
          incoming={
            'schema_version':1,'id':slug,'status':'editor_approved',
            'approved_by':'human_editor','approved_at':'2026-11-04',
            'title':'Тестовый выпуск сайта из настоящего редакционного входящего ящика',
            'dzen_title':'Тестовый выпуск сайта из настоящего редакционного входящего ящика',
            'summary':'Локальная CI проверка преобразования утверждённой новости в страницу сайта.',
            'rubric':'news','section':'НОВОСТИ ИИ',
            'source_url':'https://example.org/hpii-site-first-smoke-test',
            'source_title':'Технический фиктивный источник CI',
            'related_dzen_ids':[],
            'article_markdown':(
              ('Технический **полный абзац** для проверки публикации на сайте. ' * 10)
              + '\n\n## Раздел новой статьи\n\n'
              + ('Проверяем *реальные* структуры HTML и [источник](https://example.org/hpii-site-first-smoke-test). ' * 8)
              + '\n\n- **Первый** проверенный пункт\n- Второй пункт'
              + '\n\n1. Сначала сайт\n2. Потом Дзен'
              + '\n\n> Это цитата без потери *интонации*.\n> — Редактор ХПИИ'
              + '\n\n### Технические выводы\n\n'
              + 'Проверяем на настоящем генераторе сайта, без внешней публикации.'
            )
          }
          target=root/'editorial_inbox/stories'/f'{slug}.json'
          target.write_text(json.dumps(incoming,ensure_ascii=False),encoding='utf-8')
          Image.effect_noise((1024,576),68).convert('RGB').save(
            root/'editorial_inbox/covers'/f'{slug}.webp','WEBP',quality=88)
          PY
          python3 scripts/site_first_inbox.py site-first-ci-smoke-20261104 --stage --publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          slug='site-first-ci-smoke-20261104'
          root=Path('.')
          entries=json.loads((root/'news.json').read_text(encoding='utf-8'))
          old=int(Path('/tmp/site-first-old-count').read_text())
          assert len(entries)==old+1,(len(entries),old)
          new=next(x for x in entries if x['id']==slug)
          assert not new.get('dzen_id')
          page=(root/'articles'/slug/'index.html').read_text()
          assert '<strong>полный абзац</strong>' in page
          assert '<em>реальные</em>' in page
          assert '<h2>Раздел новой статьи</h2>' in page
          assert '<h3>Технические выводы</h3>' in page
          approved=json.loads((root/'content/approved'/f'{slug}.json').read_text())
          incoming=json.loads((root/'editorial_inbox/stories'/f'{slug}.json').read_text())
          assert approved['article_markdown']==incoming['article_markdown']
          assert '<ul class="editorial-list">' in page
          assert '<ol class="editorial-list">' in page
          assert '<blockquote class="editorial-quote">' in page
          assert 'href="https://example.org/hpii-site-first-smoke-test"' in page
          assert 'https://iipike.ru/articles/'+slug+'/' in (root/'sitemap.xml').read_text()
          assert 'https://iipike.ru/articles/'+slug+'/' in (root/'feed.xml').read_text()
          print('PASS: site-first HTML, RSS, rubrics and Sitemap compiled without any external publication')
          PY
