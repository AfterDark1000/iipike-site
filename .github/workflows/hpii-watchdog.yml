name: HPII — watchdog (no publishing)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hpii-watchdog.yml'
      - 'scripts/watchdog.js'
      - 'scripts/watchdog_queue.py'
      - 'scripts/site_release_quarantine.py'
      - 'tests/test_site_release_quarantine.py'
      - 'tests/watchdog.test.js'
      - 'tests/test_watchdog_queue.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hpii-watchdog.yml'
      - 'scripts/watchdog.js'
      - 'scripts/watchdog_queue.py'
      - 'scripts/site_release_quarantine.py'
      - 'tests/test_site_release_quarantine.py'
      - 'tests/watchdog.test.js'
      - 'tests/test_watchdog_queue.py'
  workflow_dispatch:
  # Watch actual deploy completion, not only the hourly queue forecast.
  workflow_run:
    # React after *every* publisher attempt, especially failures; do not wait
    # for the next hourly sweep or for a later Pages deploy to hide the stall.
    workflows:
      - 'pages build and deployment'
      - 'HPII — site-first scheduled hourly queue'
      - 'HPII — one-off recovery through Gemini (NO BULK DUMP)'
    types: [completed]
  schedule:
    - cron: '13 * * * *'

# Never grant permission to publish, push code, or modify secrets.
permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: hpii-watchdog
  cancel-in-progress: false

jobs:
  watchdog-offline-pr-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test watcher without incidents or publication
        run: |
          node --check scripts/watchdog.js
          python3 -m py_compile scripts/watchdog_queue.py
          node --test tests/watchdog.test.js
          python3 -m unittest discover -s tests -p 'test_watchdog_queue.py' -v
          python3 -m unittest discover -s tests -p 'test_site_release_quarantine.py' -v

  watchdog:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout monitoring code (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Regression tests for time and spacing checks
        run: |
          node --test tests/watchdog.test.js
          python3 -m unittest discover -s tests -p 'test_watchdog_queue.py' -v
          python3 -m unittest discover -s tests -p 'test_site_release_quarantine.py' -v
      - name: Inspect site-first queue from local Git refs (read-only)
        run: python3 scripts/watchdog_queue.py --output /tmp/hpii-queue-health.json
      - name: Check schedule, queue, public site and open incidents
        uses: actions/github-script@v7
        with:
          script: |
            const {main} = require('./scripts/watchdog.js');
            await main({github, context, core});
