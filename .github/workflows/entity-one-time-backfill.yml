name: HPII — one-time entity backfill on isolated branch (NO PUBLICATION)
on:
  push:
    branches:
      - feature/backfill-entity-taxonomy-20261111
    paths:
      - 'scripts/backfill_article_entities.py'
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/backfill-entity-taxonomy-20261111
          fetch-depth: 0
          persist-credentials: true
      - name: Install local site tests
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Apply reviewed header-only backfill in isolated worktree
        run: python3 scripts/backfill_article_entities.py --apply
      - name: Test every article, archive, entity page and sitemap before writing
        run: |
          python3 scripts/backfill_article_entities.py --check
          python3 -m scripts.site_entities --check
          python3 scripts/build_sitemap.py --check
          python3 scripts/build_topics.py --check
          python3 scripts/build_rubrics.py --check
          python3 scripts/build_home_published.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Verify only reviewed article HTML is changed
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          reg=json.loads(Path('data/entity_registry.json').read_text(encoding='utf-8'))
          allowed={f'articles/{sid}/index.html' for kind in ('companies','products')
                   for e in reg[kind] for sid in e['article_ids']}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if not changed or not changed <= allowed:
              raise SystemExit('Unexpected/empty migration files: '+str(sorted(changed-allowed)))
          print('Verified edited article headers:',len(changed))
          PY
      - name: Commit reviewed headers to the isolated branch only
        run: |
          git add -- articles/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "site: backfill curated company and product chips in article headers"
          git push origin HEAD:refs/heads/feature/backfill-entity-taxonomy-20261111
