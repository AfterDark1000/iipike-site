name: Build third HPII historical batch - 30 verified originals (ISOLATED)
on:
  push:
    branches: [archive/batch3-fast-20261104]
    paths: ['.github/workflows/batch3-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/archive/batch3-fast-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/batch3-fast-20261104
          persist-credentials: true
      - name: Preserve thirty authentic article texts, dates and original image references
        run: |
          python3 research/prepare_next30.py
          python3 - <<'PY'
          import json
          r=json.load(open('research/batch3_preparation_report.json'))
          assert r['requested']==30 and r['ready']==30 and r['not_ready']==0, r
          print('All 30 original articles and covers verified.')
          PY
      - name: Generate static articles, taxonomy, RSS, sitemap and homepage in feature branch only
        run: |
          set -e
          python3 - <<'PY' > /tmp/batch3-ready-slugs.txt
          import json
          r=json.load(open('research/batch3_preparation_report.json'))
          print('\n'.join(e['slug'] for e in r['entries'] if e['status']=='ready'))
          PY
          while read -r slug; do
            test -n "$slug" || continue
            python3 scripts/publish_approved_article.py "$slug"
            python3 scripts/publish_approved_article.py "$slug" --publish
          done < /tmp/batch3-ready-slugs.txt
      - name: Run regression tests without publication to main
        run: |
          python3 scripts/build_rubrics.py --check
          python3 scripts/build_home_published.py --check
          python3 scripts/build_sitemap.py --check
          python3 -m unittest discover -s tests -p 'test_archival_batch3.py' -v
          python3 -m unittest discover -s tests -p 'test_historical_batch.py' -v
          python3 -m unittest discover -s tests -p 'test_search_indexing.py' -v
          python3 -m unittest discover -s tests -p 'test_site_rubrics_related.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_publisher.py' -v
          python3 -m unittest discover -s tests -p 'test_homepage.py' -v
          python3 -m unittest discover -s tests -p 'test_social_footer.py' -v
      - name: Store regeneration report as safe artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hpii-third-batch-preparation
          path: research/batch3_preparation_report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Save approved HTML and indexes on isolated branch only
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/approved/ news.json index.html articles/ rubrics/ sitemap.xml feed.xml research/batch3_preparation_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive: generate 30 original-date HPII HTML articles with authentic covers'
            git pull --rebase origin archive/batch3-fast-20261104
            git push origin HEAD:archive/batch3-fast-20261104
          fi
