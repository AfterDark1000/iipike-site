name: HPII — WebP binary bridge tests (NO PUBLICATION)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/prepare_auto_cover_transfer.py'
      - 'tests/test_prepare_auto_cover_transfer.py'
      - 'docs/AUTO_COVER_BINARY_BRIDGE.md'
      - '.github/workflows/hpii-cover-transfer-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_auto_cover_transfer.py'
      - 'tests/test_prepare_auto_cover_transfer.py'
      - '.github/workflows/hpii-cover-transfer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-binary-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real WebP codec
        run: python -m pip install --disable-pip-version-check pillow
      - name: Check source and run roundtrip tests
        run: |
          python -m py_compile scripts/prepare_auto_cover_transfer.py
          python -m unittest discover -s tests -p 'test_prepare_auto_cover_transfer.py' -v
