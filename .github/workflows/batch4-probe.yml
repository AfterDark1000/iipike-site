name: HPII batch4 verify thirty historical Dzen sources (research only)
on:
  push:
    branches: [archive/batch4-20261104]
    paths: ['.github/workflows/batch4-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/archive/batch4-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/batch4-20261104
          persist-credentials: true
      - name: Install read-only browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Read public Dzen article originals, preserve exact publication dates
        run: python3 research/probe_next30.py
      - name: Keep diagnostic backup even on error
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hpii-fourth-batch-source-check
          path: research/batch4_probe_results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save verified source page evidence to isolated branch only
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/batch4_probe_results.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: independently verify thirty original Dzen article pages'
            git pull --rebase origin archive/batch4-20261104
            git push origin HEAD:archive/batch4-20261104
          fi
