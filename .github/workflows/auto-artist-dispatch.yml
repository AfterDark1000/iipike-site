name: HPII — artist dispatcher (NO GENERATION OR PUBLICATION)
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
  # Backup trigger: GitHub may delay or skip scheduled events.
  # The watchdog runs independently and has no dependency on this dispatcher.
  workflow_run:
    workflows: ['HPII — watchdog (no publishing)']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/auto_artist_dispatch.py'
      - 'tests/test_auto_artist_dispatch.py'
      - 'data/auto_artist_holds.json'
      - '.github/workflows/auto-artist-dispatch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/auto_artist_dispatch.py'
      - 'tests/test_auto_artist_dispatch.py'
      - 'data/auto_artist_holds.json'
      - '.github/workflows/auto-artist-dispatch.yml'
permissions:
  contents: read
concurrency:
  group: hpii-artist-dispatch-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests -p 'test_auto_artist_dispatch.py' -v
      - name: Read-only rehearsal against current editorial snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin editorial-intake
          work="$RUNNER_TEMP/hpii-artist-test-intake"
          git worktree add --detach "$work" origin/editorial-intake
          python3 scripts/auto_artist_dispatch.py --main "$PWD" --intake "$work" --parallel
          git diff --exit-code
          git worktree remove --force "$work"
  dispatch:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare one safe drawing assignment (no article or image writes)
        shell: bash
        run: |
          set -euo pipefail
          parallel=()
          # A transient /health failure must not silently disable a feature
          # verified by the successful, recent gateway deployment pipeline.
          # Fail closed unless live health OR a deployment's live-check step
          # was actually successful. No unverified source-code assumption.
          if GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" python3 - <<'PY'
          import datetime, json, os, urllib.request
          from urllib.error import HTTPError, URLError

          health = 'https://hpii-admin-gateway.svuktablet.workers.dev/health'
          try:
              request = urllib.request.Request(health, headers={'User-Agent': 'HPII-Artist-Dispatcher'})
              with urllib.request.urlopen(request, timeout=12) as response:
                  payload = json.load(response)
              if payload.get('ok') is True and payload.get('parallel_cover_review') is True:
                  print('ARTIST_PARALLEL_VERIFIED:live_health')
                  raise SystemExit(0)
              print('Artist: live health does not confirm parallel review')
          except (HTTPError, URLError, TimeoutError, ValueError, OSError) as exc:
              print('Artist: live health unavailable:', type(exc).__name__)
          # The deploy workflow's last step makes the *same live health
          # assertion*. Require it to have succeeded, and limit its age.
          base = 'https://api.github.com/repos/AfterDark1000/iipike-site'
          token = os.environ.get('GITHUB_TOKEN', '')
          if not token:
              raise SystemExit('ARTIST_PARALLEL_UNVERIFIED:no_actions_token')
          def github(path):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'HPII-Artist-Dispatcher'})
              with urllib.request.urlopen(request, timeout=12) as response:
                  return json.load(response)
          try:
              runs = github('/actions/workflows/hpii-admin-gateway-deploy.yml/runs?status=success&per_page=5')['workflow_runs']
              cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=7)
              for run in runs:
                  created = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
                  if created < cutoff or run.get('head_branch') != 'main':
                      continue
                  jobs = github('/actions/runs/' + str(run['id']) + '/jobs?per_page=100')['jobs']
                  for job in jobs:
                      if job.get('conclusion') != 'success':
                          continue
                      steps = {step.get('name'): step.get('conclusion') for step in job.get('steps', [])}
                      deploy = 'Deploy ONLY hpii-admin-gateway; retain Cloudflare OAuth runtime secrets'
                      confirm = 'Confirm live gateway API supports cover versions up to v5 and the First Car binding'
                      if steps.get(deploy) == 'success' and steps.get(confirm) == 'success':
                          print('ARTIST_PARALLEL_VERIFIED:successful_live_deploy_run:' + str(run['id']))
                          raise SystemExit(0)
          except (HTTPError, URLError, TimeoutError, KeyError, ValueError, OSError) as exc:
              print('Artist: deployment verification unavailable:', type(exc).__name__)
          raise SystemExit('ARTIST_PARALLEL_UNVERIFIED:requires_live_health_or_confirmed_deploy')
          PY
          then
            parallel=(--parallel)
          fi
          work="$RUNNER_TEMP/hpii-artist-intake"
          for attempt in 1 2 3; do
            git fetch origin main editorial-intake
            git worktree add --detach "$work" origin/editorial-intake
            python3 scripts/auto_artist_dispatch.py --main "$PWD" --intake "$work" "${parallel[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            git -C "$work" add -- editorial_inbox/auto_artist_dispatch/current.json
            if git -C "$work" diff --cached --quiet; then
              git worktree remove "$work"
              exit 0
            fi
            test "$(git -C "$work" diff --cached --name-only)" = editorial_inbox/auto_artist_dispatch/current.json
            git -C "$work" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'artist: prepare next non-publishing drawing assignment [skip ci]'
            if git -C "$work" push origin HEAD:refs/heads/editorial-intake; then
              git worktree remove "$work"
              exit 0
            fi
            git worktree remove "$work" --force
          done
          echo 'ARTIST_DISPATCH_CONCURRENT_UPDATE' >&2
          exit 1
