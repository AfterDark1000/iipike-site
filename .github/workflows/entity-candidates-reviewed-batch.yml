name: Entity catalog reviewed batch 2 (temporary)
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'tech/entity-candidates-review-2-20261128' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech/entity-candidates-review-2-20261128
      - name: Generate reviewed entries using canonical renderer
        run: |
          python3 - <<'PY'
          import json, copy, re
          from pathlib import Path
          from html import escape
          from scripts.site_entities import validate_public_registry, render_all_entities
          from scripts.backfill_article_entities import update_header
          root = Path('.')
          reg_path = root / 'data/entity_registry.json'
          old = json.loads(reg_path.read_text())
          reg = copy.deepcopy(old)
          cand = json.loads((root/'data/entity_candidates.json').read_text())
          rows = json.loads((root/'news.json').read_text())
          known = {r['id']:r for r in rows}
          # Explicit editorial selections: direct participants, not incidental
          # investors, benchmark competitors, authorities or general mentions.
          companies = {
              "qualcomm": "Процессоры и локальные ИИ-разработки Qualcomm.",
              "warby-parker": "Очки и совместные разработки носимых ИИ-устройств Warby Parker.",
              "gentle-monster": "Дизайн очков и совместные проекты носимых ИИ-устройств Gentle Monster.",
              "american-express": "Платёжные решения American Express для ИИ-агентов.",
              "mastercard": "Платёжная инфраструктура Mastercard для ИИ-агентов.",
              "visa": "Платёжная инфраструктура Visa для ИИ-агентов.",
              "dark-sky-films": "Кинопрокат и фильмы об искусственном интеллекте Dark Sky Films.",
              "bazelevs": "Кинопроизводство Bazelevs и проекты, связанные с ИИ.",
              "house-house": "Игровые проекты House House и применение ИИ в разработке.",
              "wowpoint": "Кино и сериалы WOWPOINT, связанные с ИИ.",
              "cj-enm": "Кино и развлекательные проекты CJ ENM, связанные с ИИ.",
              "ggml-org": "Команда открытых проектов ggml и llama.cpp для локального запуска моделей.",
              "byteplus": "Облачные платформы и доступ к ИИ-моделям BytePlus.",
              "purga-studio": "Творческие проекты PURGA Studio с использованием генеративного ИИ.",
              "bank-of-america": "Исследования рынка ИИ и применение ИИ в банковских сервисах Bank of America.",
              "supermicro": "Серверное оборудование и инфраструктура ИИ Supermicro.",
              "calif": "Исследования кибербезопасности и программных уязвимостей Calif.",
              "citibank": "ИИ-агенты и банковские сервисы Citi.",
              "nous-research": "Открытые языковые модели и агенты Nous Research.",
              "mansa": "Кино и сериалы Mansa с использованием ИИ.",
              "apollo-global-management": "Применение ИИ и инвестиции в ИИ-инфраструктуру Apollo Global Management.",
              "lvmh": "Медиапроекты и партнёрства LVMH в области ИИ.",
              "groupe-figaro": "Медиа и соглашения об использовании контента Groupe Figaro.",
              "ebay": "ИИ и безопасность электронной торговли eBay.",
              "airbnb": "Применение ИИ в сервисах Airbnb.",
              "doordash": "Применение ИИ в сервисах DoorDash.",
              "moonshot-ai": "Языковые модели и сервисы Moonshot AI.",
              "gallium-studios": "Разработка игр с ИИ в Gallium Studios.",
              "artificial-agency": "ИИ-системы для игровых персонажей Artificial Agency.",
              "synopsys": "Инструменты проектирования микросхем и ИИ-разработки Synopsys.",
              "ircam-amplify": "ИИ-инструменты анализа аудиозаписей Ircam Amplify.",
              "hubspot": "Корпоративные ИИ-инструменты и CRM-интеграции HubSpot.",
              "autoware-foundation": "Открытая платформа и экосистема автономного вождения Autoware Foundation."
          }
          restrict = {
              "airbnb": [
                  "us-chinese-ai-disclosure-proposal-20261118"
              ],
              "bank-of-america": [
                  "bofa-fund-managers-ai-bubble-baidu-20261117"
              ]
          }
          products = [
              [
                  "cortex-kora",
                  "kora",
                  "KORA",
                  "kora-systems",
                  ""
              ],
              [
                  "autoware autoe2e meteor-autoware",
                  "autoware",
                  "Autoware",
                  "autoware-foundation",
                  "Открытая платформа автономного вождения Autoware."
              ],
              [
                  "alpamayo-2-edge",
                  "alpamayo",
                  "Alpamayo",
                  "nvidia",
                  "Модели NVIDIA для автономного вождения."
              ],
              [
                  "oneplanner",
                  "oneplanner",
                  "OnePlanner",
                  "tier-iv",
                  "Модель планирования движения TIER IV."
              ],
              [
                  "latentdrive",
                  "latentdrive",
                  "LatentDrive",
                  "tier-iv",
                  "Модель автономного вождения TIER IV."
              ],
              [
                  "tabletop",
                  "tabletop",
                  "Tabletop",
                  "google",
                  "ИИ-инструмент Google Tabletop."
              ],
              [
                  "intelligent-eyewear",
                  "intelligent-eyewear",
                  "Intelligent Eyewear",
                  "google",
                  "Умные очки с Gemini."
              ],
              [
                  "dots",
                  "dots",
                  "Dots",
                  "openai",
                  ""
              ],
              [
                  "llama-cpp",
                  "llama-cpp",
                  "llama.cpp",
                  "ggml-org",
                  "Открытый инструмент локального запуска языковых моделей."
              ],
              [
                  "ggml",
                  "ggml",
                  "ggml",
                  "ggml-org",
                  "Библиотека для эффективных вычислений и запуска моделей."
              ],
              [
                  "modelark",
                  "modelark",
                  "ModelArk",
                  "byteplus",
                  "Платформа доступа к ИИ-моделям BytePlus."
              ],
              [
                  "google-pay",
                  "google-pay",
                  "Google Pay",
                  "google",
                  "Платёжный сервис Google и его интеграции с ИИ."
              ],
              [
                  "codename-mdash",
                  "mai-cyber",
                  "MAI Cyber",
                  "microsoft",
                  ""
              ],
              [
                  "microsoft-entra",
                  "microsoft-entra",
                  "Microsoft Entra",
                  "microsoft",
                  "Управление идентификацией и доступом, включая ИИ-агентов."
              ],
              [
                  "hermes",
                  "hermes",
                  "Hermes",
                  "nous-research",
                  "Модели и агентные разработки Hermes."
              ],
              [
                  "aws-marketplace",
                  "aws-marketplace",
                  "AWS Marketplace",
                  "amazon",
                  "Облачная площадка AWS и интеграции ИИ-агентов."
              ],
              [
                  "aion-instruct",
                  "aion-instruct",
                  "Aion Instruct",
                  "microsoft",
                  "Локальная модель Microsoft для браузера Edge."
              ],
              [
                  "project-suncatcher",
                  "project-suncatcher",
                  "Project Suncatcher",
                  "google",
                  "Проект вычислительной инфраструктуры Google в космосе."
              ],
              [
                  "token-exchange",
                  "token-exchange",
                  "Token Exchange",
                  "baidu",
                  "Площадка Baidu для доступа к ИИ-моделям."
              ],
              [
                  "eno",
                  "eno",
                  "Eno",
                  "genesis-ai",
                  "Робототехнические разработки Eno."
              ],
              [
                  "artist-profile-protection",
                  "artist-profile-protection",
                  "Artist Profile Protection",
                  "spotify",
                  "Защита профилей музыкантов от поддельных публикаций."
              ],
              [
                  "h3-move",
                  "suno-visuals",
                  "Suno Visuals",
                  "suno",
                  ""
              ],
              [
                  "kimi",
                  "kimi",
                  "Kimi",
                  "moonshot-ai",
                  "Языковые модели и ассистент Kimi."
              ],
              [
                  "composer-2",
                  "composer",
                  "Composer",
                  "cursor",
                  "Семейство моделей Cursor для программирования."
              ],
              [
                  "mymems",
                  "mymems",
                  "MyMems",
                  "gallium-studios",
                  "Игра с ИИ-персонажами и мирами на основе личных воспоминаний."
              ],
              [
                  "chatgpt-for-sales",
                  "chatgpt",
                  "ChatGPT",
                  "openai",
                  ""
              ]
          ]
          product_restrict = {
              "dots": [
                  "openai-chatgpt-for-sales-20261117",
                  "openai-dots-chatgpt-plus-test-20261119",
                  "openai-chatgpt-wallet-dots-20261113"
              ]
          }
          by_kind = {k:{e['key']:e for e in cand[k]} for k in ('companies','products')}
          existing = {k:{e['key']:e for e in reg[k]} for k in ('companies','products')}
          def evidence(kind, key, restrictions):
              e = by_kind[kind].get(key)
              if not e: raise ValueError('Missing reviewed candidate '+key)
              return list(dict.fromkeys(x['article_id'] for x in e['evidence']
                  if x['article_id'] in known and (key not in restrictions or x['article_id'] in restrictions[key])))
          def add(kind, key, name, desc, ids, owner=None):
              if not ids: return
              if key not in existing[kind]:
                  assert desc
                  item = dict(key=key,name=name,description=desc,article_ids=[])
                  if owner: item['company']=owner
                  existing[kind][key]=item
                  reg[kind].append(item)
              item=existing[kind][key]
              if owner and item['company']!=owner: raise ValueError('Owner mismatch '+key)
              for ident in ids:
                  if ident not in item['article_ids']: item['article_ids'].append(ident)
          for key,desc in companies.items():
              add('companies',key,by_kind['companies'][key]['name'],desc,evidence('companies',key,restrict))
          for key, ident in [('salesforce','openai-chatgpt-for-sales-20261117'),('cursor','us-chinese-ai-disclosure-proposal-20261118'),('baidu','bofa-fund-managers-ai-bubble-baidu-20261117')]:
              e=existing['companies'][key]
              if ident in known: add('companies',key,e['name'],e['description'],[ident])
          for sources,key,name,owner,desc in products:
              ids=list(dict.fromkeys(i for s in sources.split() for i in evidence('products',s,product_restrict)))
              if not ids: continue
              if owner not in existing['companies']:
                  raise ValueError('Unregistered owner '+owner)
              add('products',key,name,desc,ids,owner)
              co=existing['companies'][owner]
              add('companies',owner,co['name'],co['description'],ids)
          reg['note']='Редакционная разметка опубликованного архива ХПИИ. Только проверенные связи с главными участниками и продуктами; случайные упоминания не размечаются.'
          validate_public_registry(reg,rows)
          # Existing assignments are append-only; no story body is changed.
          for kind in ('companies','products'):
              for e in old[kind]:
                  assert existing[kind][e['key']]['article_ids'][:len(e['article_ids'])]==e['article_ids']
          affected={i for k in ('companies','products') for e in reg[k] for i in e['article_ids']}
          headers=0
          for ident in sorted(affected):
              path=root / known[ident]['url'] / 'index.html'
              before=path.read_text()
              after=update_header(before,ident,reg,old)
              if before!=after:
                  path.write_text(after)
                  headers+=1
          # Use simple local letter emblems for new entries; never claim
          # unverified graphics are official company logos.
          for kind in ('companies','products'):
              for e in reg[kind]:
                  path=root/'assets/entity-icons'/(e['key']+'.svg')
                  if not path.exists():
                      initials=''.join(w[0] for w in re.findall(r'[\w]+', e['name'])[:2]).upper()
                      if len(initials)==1: initials=e['name'][:2].upper()
                      path.write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#30465b"/><text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">'+escape(initials)+'</text></svg>\n')
          reg_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n')
          for path,content in render_all_entities(rows,root,reg).items():
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          print('CATALOG',len(reg['companies']),len(reg['products']),'HEADERS',headers)
          PY
          python3 scripts/build_sitemap.py
          python3 -m scripts.site_entities --check
          python3 scripts/build_sitemap.py --check
      - name: Full regression tests
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit only generated taxonomy changes to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entity_registry.json assets/entity-icons entities articles sitemap.xml
          git diff --cached --stat
          git commit -m 'Expand reviewed company and product catalog'
          git push origin HEAD:tech/entity-candidates-review-2-20261128
