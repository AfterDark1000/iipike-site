                  if not path.exists():
                      initials=''.join(w[0] for w in re.findall(r'[\w]+', e['name'])[:2]).upper()
                      if len(initials)==1: initials=e['name'][:2].upper()
                      path.write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#30465b"/><text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">'+escape(initials)+'</text></svg>\n')
          reg_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n')
          for path,content in render_all_entities(rows,root,reg).items():
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          # Replace frozen pilot counts with registry-derived invariants while
          # retaining historical lower bounds and exact generated membership.
          test=root/'tests/test_site_entities.py'
          s=test.read_text()
          replacements={
              'self.assertEqual(len(self.registry["companies"]), 61)':'self.assertGreaterEqual(len(self.registry["companies"]), 61)',
              'self.assertEqual(len(self.registry["products"]), 24)':'self.assertGreaterEqual(len(self.registry["products"]), 24)',
              "self.assertEqual(sum(p.name == 'index.html' for p in pages), 86)":"self.assertEqual(sum(p.name == 'index.html' for p in pages), 1 + len(self.registry['companies']) + len(self.registry['products']))",
              'self.assertIn("Компании — 61", html)':'self.assertIn(f"Компании — {len(self.registry[\'companies\'])}", html)',
              'self.assertIn("Продукты — 24", html)':'self.assertIn(f"Продукты — {len(self.registry[\'products\'])}", html)',
              "self.assertEqual(html.count('class=\"topic-index-link entity-tile\"'), 85)":"self.assertEqual(html.count('class=\"topic-index-link entity-tile\"'), len(self.registry['companies']) + len(self.registry['products']))",
          }
          for a,b in replacements.items():
              assert a in s,a
              s=s.replace(a,b)
          test.write_text(s)
          print('CATALOG',len(reg['companies']),len(reg['products']),'HEADERS',headers)
          PY
          python3 scripts/build_sitemap.py
          python3 -m scripts.site_entities --check
          python3 scripts/build_sitemap.py --check
      - name: Full regression tests
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit only generated taxonomy changes to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entity_registry.json assets/entity-icons entities articles sitemap.xml tests/test_site_entities.py
          git diff --cached --stat
          git commit -m 'Expand reviewed company and product catalog'
          git push origin HEAD:tech/entity-candidates-review-20261128
