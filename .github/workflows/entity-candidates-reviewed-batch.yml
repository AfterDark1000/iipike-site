name: Entity catalog reviewed batch 3 (temporary)
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'tech/entity-candidates-review-3-20261128' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech/entity-candidates-review-3-20261128
      - name: Generate reviewed entries using canonical renderer
        run: |
          python3 - <<'PY'
          import json, copy, re
          from pathlib import Path
          from html import escape
          from scripts.site_entities import validate_public_registry, render_all_entities
          from scripts.backfill_article_entities import update_header
          root = Path('.')
          reg_path = root / 'data/entity_registry.json'
          old = json.loads(reg_path.read_text())
          reg = copy.deepcopy(old)
          cand = json.loads((root/'data/entity_candidates.json').read_text())
          rows = json.loads((root/'news.json').read_text())
          known = {r['id']:r for r in rows}
          # Explicit editorial selections: direct participants, not incidental
          # investors, benchmark competitors, authorities or general mentions.
          companies = {
              "shaanxi-bosuan": "Поставщик вычислительного оборудования Shaanxi Bosuan Network Technology.",
              "easycall": "Телефонные сервисы и внедрение голосового ИИ EasyCall.",
              "dataone": "Инфраструктура и эксплуатация центров обработки данных DataOne.",
              "cvs-health": "Применение искусственного интеллекта в здравоохранении CVS Health.",
              "cigna-healthcare": "Применение ИИ в медицинском страховании и сервисах Cigna Healthcare.",
              "asml": "Оборудование для производства микросхем и связанные с отраслью ИИ проекты ASML.",
              "bubblemaps": "Аналитика блокчейна и расследования Bubblemaps.",
              "threatbook": "Кибербезопасность и ИИ-инструменты ThreatBook.",
              "century-litong": "Облачная инфраструктура и аренда ИИ-серверов Century Litong.",
              "century-longteng": "Инвестиции в инфраструктуру и компании, связанные с ИИ-серверами Century Longteng.",
              "pnc": "Банковские сервисы и политика доступа ИИ-агентов PNC.",
              "wells-fargo": "Банковские сервисы и политика доступа ИИ-агентов Wells Fargo.",
              "graphic-india": "Кино и развлекательные проекты Graphic India, связанные с ИИ.",
              "sya-concept": "Кинопроизводство S’YA Concept и проекты, связанные с ИИ.",
              "elvis-presley-enterprises": "Права на образ и голос Элвиса Пресли в спорах об использовании ИИ.",
              "wpic": "Исследования электронной торговли и продвижение товаров с помощью ИИ WPIC."
          }
          restrict = {}
          products = [
              [
                  "douyin",
                  "douyin",
                  "Douyin",
                  "bytedance",
                  "Социальная и торговая платформа Douyin."
              ],
              [
                  "openai-o1",
                  "openai-o1",
                  "OpenAI o1",
                  "openai",
                  "Семейство моделей OpenAI o1 для задач с рассуждением."
              ],
              [
                  "wan-3-0",
                  "wan",
                  "Wan",
                  "alibaba",
                  "Семейство моделей генерации видео Wan."
              ],
              [
                  "minimax-h3-max",
                  "minimax-h3",
                  "MiniMax H3",
                  "minimax",
                  "Семейство видеомоделей MiniMax H3."
              ],
              [
                  "starmind",
                  "starmind",
                  "Starmind",
                  "spacex",
                  "Проект орбитальной вычислительной инфраструктуры SpaceX."
              ],
              [
                  "openai-csam-image-classifier",
                  "openai-csam-image-classifier",
                  "OpenAI CSAM Image Classifier",
                  "openai",
                  "Модель выявления материалов сексуального насилия над детьми."
              ]
          ]
          product_restrict = {}
          by_kind = {k:{e['key']:e for e in cand[k]} for k in ('companies','products')}
          existing = {k:{e['key']:e for e in reg[k]} for k in ('companies','products')}
          def evidence(kind, key, restrictions):
              e = by_kind[kind].get(key)
              if not e: raise ValueError('Missing reviewed candidate '+key)
              return list(dict.fromkeys(x['article_id'] for x in e['evidence']
                  if x['article_id'] in known and (key not in restrictions or x['article_id'] in restrictions[key])))
          def add(kind, key, name, desc, ids, owner=None):
              if not ids: return
              if key not in existing[kind]:
                  assert desc
                  item = dict(key=key,name=name,description=desc,article_ids=[])
                  if owner: item['company']=owner
                  existing[kind][key]=item
                  reg[kind].append(item)
              item=existing[kind][key]
              if owner and item['company']!=owner: raise ValueError('Owner mismatch '+key)
              for ident in ids:
                  if ident not in item['article_ids']: item['article_ids'].append(ident)
          for key,desc in companies.items():
              add('companies',key,by_kind['companies'][key]['name'],desc,evidence('companies',key,restrict))
          for key, ident in [('bank-of-america','citibank-ai-agent-liability-20261120')]:
              e=existing['companies'][key]
              if ident in known: add('companies',key,e['name'],e['description'],[ident])
          for sources,key,name,owner,desc in products:
              ids=list(dict.fromkeys(i for s in sources.split() for i in evidence('products',s,product_restrict)))
              if not ids: continue
              if owner not in existing['companies']:
                  raise ValueError('Unregistered owner '+owner)
              add('products',key,name,desc,ids,owner)
              co=existing['companies'][owner]
              add('companies',owner,co['name'],co['description'],ids)
          reg['note']='Редакционная разметка опубликованного архива ХПИИ. Только проверенные связи с главными участниками и продуктами; случайные упоминания не размечаются.'
          validate_public_registry(reg,rows)
          # Existing assignments are append-only; no story body is changed.
          for kind in ('companies','products'):
              for e in old[kind]:
                  assert existing[kind][e['key']]['article_ids'][:len(e['article_ids'])]==e['article_ids']
          affected={i for k in ('companies','products') for e in reg[k] for i in e['article_ids']}
          headers=0
          for ident in sorted(affected):
              path=root / known[ident]['url'] / 'index.html'
              before=path.read_text()
              after=update_header(before,ident,reg,old)
              if before!=after:
                  path.write_text(after)
                  headers+=1
          # Use simple local letter emblems for new entries; never claim
          # unverified graphics are official company logos.
          for kind in ('companies','products'):
              for e in reg[kind]:
                  path=root/'assets/entity-icons'/(e['key']+'.svg')
                  if not path.exists():
                      initials=''.join(w[0] for w in re.findall(r'[\w]+', e['name'])[:2]).upper()
                      if len(initials)==1: initials=e['name'][:2].upper()
                      path.write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#30465b"/><text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">'+escape(initials)+'</text></svg>\n')
          reg_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n')
          for path,content in render_all_entities(rows,root,reg).items():
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          print('CATALOG',len(reg['companies']),len(reg['products']),'HEADERS',headers)
          PY
          python3 scripts/build_sitemap.py
          python3 -m scripts.site_entities --check
          python3 scripts/build_sitemap.py --check
      - name: Full regression tests
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit only generated taxonomy changes to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entity_registry.json assets/entity-icons entities articles sitemap.xml
          git diff --cached --stat
          git commit -m 'Expand reviewed company and product catalog'
          git push origin HEAD:tech/entity-candidates-review-3-20261128
