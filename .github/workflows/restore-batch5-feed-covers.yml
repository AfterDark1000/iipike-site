name: HPII repair batch5 art from official Dzen feed image IDs
on:
  push:
    branches: [repair/batch5-original-covers-20261104]
    paths: ['.github/workflows/restore-batch5-feed-covers.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/repair/batch5-original-covers-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/batch5-original-covers-20261104
      - name: Install read-only browser and image decoder
        run: |
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Recover original article cover image, not OpenGraph card
        run: python3 research/recover_from_feed.py
      - name: Save diagnostics and valid original image bytes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: batch5-original-cover-recovery
          path: |
            research/batch5_feed_cover_results.json
            assets/imported/*.webp
          if-no-files-found: ignore
      - name: Commit recovered original images ONLY in isolated repair branch
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/batch5_feed_cover_results.json assets/imported/
          if ! git diff --cached --quiet; then
            git commit -m 'repair: use article-owned source images, not Dzen OG cards'
            git push origin HEAD:repair/batch5-original-covers-20261104
          fi
