name: HPII — auto-editor published-pool sync safety (NO PUBLICATION)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync_published_auto_editor_pool.py'
      - 'tests/test_auto_editor_published_pool_sync.py'
      - '.github/workflows/site-first-scheduled-release.yml'
      - '.github/workflows/hpii-auto-editor-pool-sync-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_published_auto_editor_pool.py'
      - 'tests/test_auto_editor_published_pool_sync.py'
      - '.github/workflows/site-first-scheduled-release.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Safe autonomous publication reconciliation (no writes)
        run: |
          python3 -m unittest discover -s tests -p 'test_auto_editor_published_pool_sync.py' -v
          python3 scripts/site_news_pool.py --validate
          python3 scripts/sync_published_auto_editor_pool.py
          git diff --exit-code -- data/site_news_pool.json news.json
