name: HPII batch7 recover 40 original covers from public HPII posts
on:
  push:
    branches: [archive/batch7-research-20261104]
    paths: ['.github/workflows/batch7-cover.yml']
permissions:
  contents: read
  actions: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install image reader and Telegram archive parser
        run: python3 -m pip install pillow beautifulsoup4
      - name: Restore verified original Dzen article-page captures
        uses: actions/download-artifact@v4
        with:
          name: hpii-batch7-source-dates-probe
          run-id: 41785744045
          github-token: ${{ github.token }}
          path: research/
      - name: Recover only real HPII cover art, never Dzen OG share cards
        run: python3 research/recover_batch7_covers.py
      - name: Preserve source-matched original artwork
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hpii-batch7-original-covers-and-page-evidence
          path: |
            research/batch7_probe_results.json
            research/batch7_cover_report.json
            assets/imported/*.webp
          retention-days: 7
          if-no-files-found: ignore
