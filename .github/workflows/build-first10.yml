name: Build first ten Dzen transfers (FEATURE BRANCH ONLY)
on:
  push:
    branches: [feature/import-first10-dzen-20261104]
    paths:
      - '.github/workflows/build-first10.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/feature/import-first10-dzen-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/import-first10-dzen-20261104
          persist-credentials: true
      - name: Generate exactly ten historic article pages and indexes (NO PUBLICATION)
        run: |
          set -e
          for slug in \
            codex-git-server nvidia-local-assistant-4gb opera-browser-ai-websites \
            ai-agents-cent-spending-limit openai-agent-disabled-monitoring \
            deepseek-shutdown-override grok-mp-letters-refund google-ai-orbit \
            altman-ai-scientists-office musk-grok-bot-cost
          do
            python3 scripts/publish_approved_article.py "$slug"
            python3 scripts/publish_approved_article.py "$slug" --publish
          done
      - name: Check historical metadata, populated rubrics, RSS and sitemap
        run: |
          python3 scripts/build_rubrics.py --check
          python3 scripts/build_sitemap.py --check
          python3 -m unittest discover -s tests -p 'test_search_indexing.py' -v
          python3 -m unittest discover -s tests -p 'test_site_rubrics_related.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_publisher.py' -v
          python3 -m unittest discover -s tests -p 'test_homepage.py' -v
          python3 -m unittest discover -s tests -p 'test_social_footer.py' -v
      - name: Commit static files to feature branch only; no public deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json feed.xml sitemap.xml articles/ rubrics/
          if ! git diff --cached --quiet; then
            git commit -m 'site: generate original-date ten-article archive with original covers'
            git push origin HEAD:feature/import-first10-dzen-20261104
          fi
