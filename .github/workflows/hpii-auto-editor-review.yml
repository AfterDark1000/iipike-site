name: HPII auto editor owner decisions

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: hpii-auto-editor-review
  cancel-in-progress: false

jobs:
  record:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record revision-bound decision (no publication)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const recordReview = require('./.github/scripts/auto-editor-review.cjs');
            await recordReview({github, context});
