name: HPII — record owner decisions on auto-drafts (NO PUBLICATION)
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: hpii-auto-review-decisions
  cancel-in-progress: false

jobs:
  record:
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'HPII review: ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check version and save decision to editorial-intake only
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const issue = context.payload.issue;
            const text = issue.body || '';
            const match = /^<!-- HPII_AUTO_REVIEW_V1 -->\s*([\s\S]*?)\s*<!-- \/HPII_AUTO_REVIEW_V1 -->\s*(?:Проверка решения выполняется GitHub Actions\. Ничего не публикуется\.)?\s*$/.exec(text);
            if (!match || match[1].length > 6000) throw Error('Invalid or excessive decision body');
            let request;
            try { request = JSON.parse(match[1]); } catch { throw Error('Invalid JSON'); }
            const keys = ['action','article_id','note','revision','schema_version','updated_at'].sort();
            if (JSON.stringify(Object.keys(request).sort()) !== JSON.stringify(keys)) throw Error('Unexpected decision fields');
            if (request.schema_version !== 1 ||
                !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(request.article_id) ||
                request.article_id.length > 72 ||
                !Number.isSafeInteger(request.revision) || request.revision < 1 ||
                !['approve_text','revise','reject'].includes(request.action) ||
                typeof request.note !== 'string' || request.note.length > 4000 ||
                typeof request.updated_at !== 'string' ||
                (request.action !== 'approve_text' && !request.note.trim())) throw Error('Invalid decision');
            const branch = 'editorial-intake';
            const draftPath = 'editorial_inbox/auto_drafts/' + request.article_id + '.json';
            const draftFile = await github.rest.repos.getContent({owner,repo,path:draftPath,ref:branch});
            if (Array.isArray(draftFile.data) || draftFile.data.type !== 'file') throw Error('Missing draft file');
            const draft = JSON.parse(Buffer.from(draftFile.data.content,'base64').toString('utf8'));
            if (draft.article_id !== request.article_id ||
                draft.revision !== request.revision ||
                draft.updated_at !== request.updated_at ||
                draft.status !== 'ready_for_review') throw Error('Draft changed or is not reviewable. Refresh the admin panel.');
            const resultPath = 'editorial_inbox/auto_decisions/' + request.article_id + '-r' + request.revision + '.json';
            const result = {
              schema_version: 1,
              article_id: request.article_id,
              revision: request.revision,
              updated_at: request.updated_at,
              action: request.action,
              note: request.note,
              issue_number: issue.number,
              decided_by: issue.user.login,
              decided_at: issue.created_at,
              draft_blob_sha: draftFile.data.sha,
              status: request.action === 'revise' ? 'feedback_pending_revision' :
                      request.action === 'approve_text' ? 'text_approved_cover_pending' : 'rejected'
            };
            const content = Buffer.from(JSON.stringify(result,null,2)+'\n','utf8').toString('base64');
            // One decision per draft revision: fail closed on duplicate or stale requests.
            try {
              await github.rest.repos.getContent({owner,repo,path:resultPath,ref:branch});
              throw Error('Decision already exists for this draft revision');
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path:resultPath,branch,
              message:'review(auto-editor): record owner decision for '+request.article_id+' r'+request.revision,
              content
            });
            await github.rest.issues.createComment({owner,repo,issue_number:issue.number,
              body:'✅ Решение записано в \u0060'+resultPath+'\u0060 (ветка \u0060editorial-intake\u0060). Статус: \u0060'+result.status+'\u0060. **Материал не опубликован.**'});
