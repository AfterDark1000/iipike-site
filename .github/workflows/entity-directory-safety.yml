name: HPII — public company/product directory (NO ARTICLE PUBLICATION)
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/entity_registry.json'
      - 'scripts/site_entities.py'
      - 'scripts/site_first_inbox.py'
      - 'scripts/site_first_release_pr.py'
      - 'tests/test_editorial_entities.py'
      - 'tests/test_site_first_inbox.py'
      - 'tests/test_site_first_release_pr.py'
      - 'editorial_inbox/CHATGPT_EDITOR_INSTRUCTIONS.md'
      - 'editorial_inbox/README.md'
      - 'scripts/backfill_article_entities.py'
      - 'scripts/upgrade_article_navigation.py'
      - 'tests/test_entity_backfill.py'
      - 'assets/entity-search.js'
      - 'scripts/build_sitemap.py'
      - 'scripts/publish_approved_article.py'
      - 'tests/test_site_entities.py'
      - 'tests/test_article_entity_tags.py'
      - 'articles/**/index.html'
      - 'tests/test_approved_publisher.py'
      - 'tests/test_search_indexing.py'
      - 'entities/**'
      - 'assets/entity-icons/**'
      - 'assets/entities.css'
      - 'index.html'
      - 'articles/index.html'
      - 'sitemap.xml'
      - '.github/workflows/entity-directory-safety.yml'
permissions:
  contents: read
jobs:
  verify-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install offline test requirements
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Verify entity catalog, sitemap, and whole static site
        run: |
          python3 -m scripts.site_entities --check
          python3 scripts/build_sitemap.py --check
          python3 scripts/build_topics.py --check
          python3 scripts/build_rubrics.py --check
          python3 scripts/build_home_published.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Restrict production changes to reviewed taxonomy and navigation
        run: |
          git fetch origin main --unshallow || git fetch origin main
          python3 - <<'PY'
          import subprocess
          import json
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          exact = {'data/entity_registry.json', 'scripts/site_entities.py',
                   'scripts/site_first_inbox.py', 'scripts/site_first_release_pr.py',
                   'tests/test_editorial_entities.py', 'tests/test_site_first_inbox.py',
                   'tests/test_site_first_release_pr.py',
                   'editorial_inbox/CHATGPT_EDITOR_INSTRUCTIONS.md',
                   'editorial_inbox/README.md',
                   '.github/workflows/site-first-inbox-safety.yml',
                   'scripts/backfill_article_entities.py',
                   'scripts/upgrade_article_navigation.py',
                   'tests/test_entity_backfill.py', 'assets/entity-search.js',
                   'scripts/build_sitemap.py', 'scripts/publish_approved_article.py',
                   'tests/test_site_entities.py', 'tests/test_article_entity_tags.py',
                   'tests/test_approved_publisher.py',
                   'scripts/watchdog_queue.py', 'tests/test_watchdog_queue.py',
                   'tests/test_search_indexing.py',
                   'index.html', 'articles/index.html', 'sitemap.xml',
                   'assets/entities.css', '.github/workflows/entity-directory-safety.yml',
                   '.github/workflows/hpii-briefs.yml',
                   'admin/index.html', 'admin/briefs/index.html',
                   'assets/briefs.css', 'data/briefs/approved.json',
                   'data/briefs/candidates.json', 'docs/SHORT_NEWS.md',
                   'scripts/build_briefs.py', 'tests/test_briefs.py', 'robots.txt',
                   '.github/workflows/homepage-safety.yml',
                   '.github/workflows/hpii-publication-time-labels.yml',
                   'data/briefs/released.json', 'docs/BRIEFS_EDITOR_AGENT.md',
                   'scripts/backfill_publication_times.py', 'scripts/briefs_claim.py',
                   'scripts/editorial_routing.py', 'scripts/release_one_brief.py',
                   'scripts/site_home.py', 'scripts/site_rubrics.py',
                   'scripts/sync_briefs_pool.py', 'tests/test_brief_release_schedule.py',
                   'scripts/site_related_cards.py', 'tests/test_site_related_cards.py',
                   '.github/workflows/site-ui-safety.yml',
                   'data/dossier.json', 'scripts/site_dossier.py', 'scripts/build_dossier.py',
                   'tests/test_site_dossier.py', 'dossier/index.html', 'assets/site.css',
                   'tests/test_homepage_focus.py', 'tests/test_homepage.py',
                   'scripts/site_release_quarantine.py', 'scripts/site_publication_queue.py',
                   'tests/test_site_existing_release_branch.py', 'tests/test_site_release_quarantine.py',
                   'admin/dossier/index.html', 'admin/dossier/app.js',
                   'admin-auth-worker/src/index.mjs', 'admin-auth-worker/tests/dossier.test.mjs',
                   '.github/workflows/dossier-refresh.yml', '.github/workflows/hpii-admin-gateway-deploy.yml',
                   '.github/workflows/hpii-admin-ui-safety.yml', 'docs/DOSSIER.md',
                   'tests/test_editorial_routing.py', 'tests/test_publication_times.py',
                   'scripts/site_rich_text.py', 'tests/test_site_rich_text.py',
                   'editorial_inbox/RICH_TEXT_FORMAT.md', 'admin/dzen-tables.js',
                   'tests/test_admin_dashboard.py', 'tests/dzen-tables.test.cjs',
                   'tests/dzen-tables-browser.html'}
          # New approved rubric keys need matching editor validation, regression
          # tests and an editorial evidence policy; still run every read-only
          # site/publisher test above before allowing this *exact* file set.
          if 'scripts/site_rubrics.py' in changed:
              exact.update({
                  'scripts/auto_editor_workbench.py',
                  'tests/test_auto_editor_workbench.py',
                  'tests/test_site_rubric_order.py',
                  'tests/test_site_rubrics_related.py',
                  'docs/AUTO_EDITOR_INSTRUCTIONS.md',
                  'docs/RUBRIC_MADE_WITH_AI.md',
              })
          prefixes = ('entities/', 'assets/entity-icons/', 'briefs/')
          # Article HTML changes are restricted to the IDs already reviewed
          # in the public registry; their exact header-only diff is tested.
          registry = json.load(open('data/entity_registry.json', encoding='utf-8'))
          allowed_articles = {
              'articles/' + sid + '/index.html'
              for kind in ('companies', 'products')
              for entity in registry[kind] for sid in entity['article_ids']
          }
          # A separate, strict time-label migration may touch many existing
          # article pages. Accept them ONLY when exactly the visible date
          # string changes to the canonical local publication timestamp.
          import re
          from scripts.site_rubrics import publication_label
          registry_rows = {r['id']: r for r in json.load(
              open('news.json', encoding='utf-8'))}
          date_pat = re.compile(r'<p class="date">Опубликовано: ([^<]*)</p>')
          def only_publication_time(path):
              match = re.fullmatch(r'articles/([a-z0-9-]+)/index[.]html', path)
              if not match:
                  return False
              row = registry_rows.get(match.group(1))
              if not row:
                  return False
              try:
                  before = subprocess.check_output(
                      ['git', 'show', 'origin/main:' + path], text=True)
                  after = subprocess.check_output(
                      ['git', 'show', 'HEAD:' + path], text=True)
              except subprocess.CalledProcessError:
                  return False
              bm, am = list(date_pat.finditer(before)), list(date_pat.finditer(after))
              if len(bm) != 1 or len(am) != 1:
                  return False
              if am[0].group(1) != publication_label(row):
                  return False
              normalize = lambda v: date_pat.sub(
                  '<p class="date">Опубликовано: __TIME__</p>', v)
              return normalize(before) == normalize(after)
          # Rubrics were independently checked against their exact generator.
          allowed_time_articles = {x for x in changed if only_publication_time(x)}
          unexpected = [x for x in changed
                        if x not in exact and x not in allowed_articles
                        and x not in allowed_time_articles
                        and not x.startswith(prefixes + ('rubrics/',))]
          if unexpected:
              raise SystemExit('Unexpected editorial/production modifications: ' + str(unexpected))
          print('Taxonomy-only changes:', len(changed))
          PY
