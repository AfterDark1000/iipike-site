name: HPII auto cover validation (NO PUBLICATION)
on:
  push:
    branches: [editorial-intake]
    paths:
      - 'editorial_inbox/auto_covers/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check_auto_cover_pilot.py'
      - '.github/workflows/hpii-auto-cover-check.yml'
      - 'docs/AUTO_COVER_ARTIST_PILOT.md'
permissions:
  contents: read
jobs:
  validate-cover-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile validation
        run: python3 -m py_compile scripts/check_auto_cover_pilot.py
      - name: Check isolated candidates
        run: python3 scripts/check_auto_cover_pilot.py
