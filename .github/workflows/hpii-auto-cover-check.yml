name: HPII auto cover validation (NO PUBLICATION)
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check_auto_cover_pilot.py'
      - '.github/workflows/hpii-auto-cover-check.yml'
      - 'docs/AUTO_COVER_ARTIST_PILOT.md'

permissions:
  contents: read

jobs:
  validate-cover-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted validation code from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install WebP decoder
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Compile validation
        run: python3 -m py_compile scripts/check_auto_cover_pilot.py
      - name: Validate actual editorial-intake candidate files
        run: |
          set -euo pipefail
          git fetch origin editorial-intake
          git worktree add --detach /tmp/hpii-auto-cover-intake FETCH_HEAD
          cd /tmp/hpii-auto-cover-intake
          python3 "$GITHUB_WORKSPACE/scripts/check_auto_cover_pilot.py"
