name: HPII batch5 recover archived evidence and safely publish verified subset
on:
  push:
    branches: [prep/hpii-archive-batch5-20261104]
    paths: ['.github/workflows/batch5-restore.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  restore:
    if: github.ref == 'refs/heads/prep/hpii-archive-batch5-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prep/hpii-archive-batch5-20261104
          persist-credentials: true
      - name: Restore verified text and cover evidence without re-scraping Dzen
        uses: actions/download-artifact@v4
        with:
          name: hpii-batch5-source-recovery-and-build
          run-id: 41778333841
          github-token: ${{ github.token }}
          path: .
      - name: Confirm exact original article evidence present
        run: |
          test -s research/batch5_probe_results.json
          test -s research/batch5_cover_report.json
          python3 - <<'PY'
          import json
          x=json.load(open('research/batch5_probe_results.json'))
          print('Captured original pages:',len(x['results']))
          assert len(x['results'])==60
          PY
      - name: Recheck original matching Dzen OG artwork when image API is missing
        run: |
          python3 -m pip install pillow
          python3 research/recover_batch5_og.py
      - name: Select up to thirty complete historical stories (at least twenty)
        run: python3 research/select_batch5.py
      - name: Create reviewed historical editorial records
        run: |
          python3 research/prepare_batch5.py
          python3 - <<'PY'
          import json
          j=json.load(open('research/batch5_preparation_report.json'))
          assert 20<=j['ready']<=30 and j['not_ready']==0, j
          print('Full original text + Dzen cover:',j['ready'])
          PY
      - name: Build original-date standalone pages in isolated branch
        run: |
          set -e
          python3 - <<'PY' >/tmp/validated_slugs.txt
          import json
          j=json.load(open('research/batch5_preparation_report.json'))
          for x in j['entries']:
            if x['status']=='ready':print(x['slug'])
          PY
          while read -r slug; do
            test -n "$slug" || continue
            python3 scripts/publish_approved_article.py "$slug"
            python3 scripts/publish_approved_article.py "$slug" --publish
          done </tmp/validated_slugs.txt
      - name: Integrity regression and unique historical dates
        run: |
          python3 scripts/build_rubrics.py --check
          python3 scripts/build_home_published.py --check
          python3 scripts/build_sitemap.py --check
          python3 -m unittest discover -s tests -p 'test_archival_batch4.py' -v
          python3 -m unittest discover -s tests -p 'test_archival_batch3.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_publisher.py' -v
          python3 -m unittest discover -s tests -p 'test_search_indexing.py' -v
          python3 - <<'PY'
          import json
          rows=json.load(open('news.json'))
          orig=json.load(open('research/batch5_candidates.json'))['candidates']
          assert len(rows)==101+len(orig),len(rows)
          ids=[r['dzen_id'] for r in rows if r.get('dzen_id')]
          assert len(ids)==len(set(ids))
          assert all(any(r.get('dzen_id')==e['dzen_id'] for r in rows) for e in orig)
          print(len(rows),'full HTML articles,',len(orig),'from fifth batch')
          PY
      - name: Save successful or failed research recovery data
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hpii-batch5-recovered-release
          path: |
            research/batch5*.json
            registry/archive_batch5_candidates.json
            content/approved/*.json
            assets/imported/*.webp
            news.json
            feed.xml
            sitemap.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit only to isolated batch5 branch
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/batch5* registry/archive_batch5_candidates.json content/approved/ assets/imported/ articles/ rubrics/ news.json sitemap.xml feed.xml index.html
          if ! git diff --cached --quiet; then
            git commit -m 'archive: full original historical articles and artwork, fifth batch'
            git pull --rebase origin prep/hpii-archive-batch5-20261104
            git push origin HEAD:prep/hpii-archive-batch5-20261104
          fi
