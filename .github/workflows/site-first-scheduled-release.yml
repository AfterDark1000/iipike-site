name: HPII — site-first scheduled hourly queue
on:
  # Only exact owner-written control files can trigger site release.
  # An urgent file also needs a fresh matching commit message and validator.
  push:
    branches: [main]
    paths:
      - '.github/site-first-queue-kick.txt'
      - '.github/site-first-urgent-request.json'
  schedule:
    # Shift off the top of the hour to reduce GitHub schedule congestion.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Optional exact ready story ID. Empty means next due story.'
        type: string
        required: false
      urgent:
        description: 'Bypass 60-minute interval and future slot for this exact ID (manual only)'
        type: boolean
        required: false
        default: false
      inspect_only:
        description: 'Only refresh the queue dashboard; do not publish any article'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pages: write
  # Only to start the read-only-to-Dzen queue generator after a verified release.
  actions: write
concurrency:
  group: hpii-site-first-serial-publication
  cancel-in-progress: false
jobs:
  release-due-one:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Read current production code and full Git refs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Install image validator
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Check safe scheduled-publication selection
        run: |
          python3 -m unittest discover -s tests -p 'test_site_publication_queue.py' -v
          python3 -m unittest discover -s tests -p 'test_site_release_quarantine.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_publisher.py' -v
          python3 -m unittest discover -s tests -p 'test_dzen_rss.py' -v
      - name: Verify user-requested site release intent
        id: intent
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/site_first_release_intent.py --output "$GITHUB_OUTPUT"
      - name: Release at most one eligible editor-approved story
        id: release
        if: >-
          github.event_name != 'push' ||
          steps.intent.outputs.mode == 'queue' ||
          steps.intent.outputs.mode == 'urgent'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HPII_SITE_FIRST_SCHEDULER: '1'
          HPII_SITE_FIRST_AUTOPUBLISH: '1'
          HPII_TARGET_STORY_ID: ${{ github.event_name == 'push' && steps.intent.outputs.story_id || inputs.story_id }}
          HPII_URGENT_STORY: ${{ github.event_name == 'push' && steps.intent.outputs.urgent || inputs.urgent }}
          HPII_VERIFIED_PUSH_URGENT: ${{ github.event_name == 'push' && steps.intent.outputs.mode == 'urgent' }}
          HPII_QUEUE_INSPECT_ONLY: ${{ inputs.inspect_only }}
        run: |
          set -o pipefail
          python3 scripts/site_publication_queue.py | tee /tmp/hpii-site-release.log
          if grep -q '^ONE_RELEASE_REQUESTED:' /tmp/hpii-site-release.log; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Recompute queue dashboard after publication or failure
        if: always()
        run: |
          git fetch origin main editorial-intake
          python3 scripts/render_site_publication_queue.py --output /tmp/hpii_queue_status.md
          cat /tmp/hpii_queue_status.md >> "${GITHUB_STEP_SUMMARY}"
          printf '\n**Проверка выполнена:** %s UTC\n' "$(date -u +'%Y-%m-%d %H:%M')" >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep bookmarked GitHub queue page current (never publish to Pages)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const f = '/tmp/hpii_queue_status.md';
            if (!fs.existsSync(f)) {
              core.warning('No queue report could be generated.');
              return;
            }
            const content = fs.readFileSync(f, 'utf8');
            const path = 'editorial_inbox/QUEUE_STATUS.md';
            const { owner, repo } = context.repo;
            let sha;
            try {
              const old = await github.rest.repos.getContent({
                owner, repo, path, ref: 'editorial-intake'
              });
              if (!old.data || Array.isArray(old.data)) throw Error('Not a file');
              sha = old.data.sha;
              const previous = Buffer.from(old.data.content.replace(/\s/g, ''), 'base64').toString('utf8');
              if (previous === content) {
                core.info('Dashboard unchanged; no extra editorial-intake commit.');
                return;
              }
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'editorial-intake',
              message: 'chore: refresh GitHub-only editorial queue status [skip ci]',
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {})
            });
            core.info('Queue page updated on editorial-intake without changing main or Pages.');

      - name: Regenerate Dzen reading list after successful site release
        # A GITHUB_TOKEN push to main does not trigger another push workflow.
        # workflow_dispatch does, and is only sent after confirmed release.
        if: ${{ always() && steps.release.outcome == 'success' && steps.release.outputs.published == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'dzen-reading-queue.yml', ref: 'main'
            });
            core.info('Requested fresh Dzen prep queue after site release.');

