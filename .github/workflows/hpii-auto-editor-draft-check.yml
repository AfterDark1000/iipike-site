name: HPII — validate isolated auto-editor drafts (NO PUBLICATION)

on:
  push:
    branches: [editorial-intake]
    paths:
      - 'editorial_inbox/auto_drafts/*.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/auto_editor_workbench.py'
      - 'tests/test_auto_editor_workbench.py'
      - '.github/workflows/hpii-auto-editor-draft-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate draft schema and GitHub claim bindings (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_auto_editor_workbench.py' -q
          git fetch origin main editorial-intake
          mkdir -p "$RUNNER_TEMP/hpii-auto-draft-tree"
          git archive origin/editorial-intake editorial_inbox/auto_drafts \
            | tar -x -C "$RUNNER_TEMP/hpii-auto-draft-tree"
          python3 scripts/auto_editor_workbench.py \
            --verify-drafts "$RUNNER_TEMP/hpii-auto-draft-tree/editorial_inbox/auto_drafts"
          echo 'Drafts checked. Never publishes or approves stories.'
