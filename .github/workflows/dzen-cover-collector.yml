name: Restore Dzen covers (RESEARCH ONLY)
on:
  push:
    branches: [research/dzen-migration-first10-20261104]
    paths:
      - 'research/download_dzen_covers.py'
      - '.github/workflows/dzen-cover-collector.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-covers:
    if: github.ref == 'refs/heads/research/dzen-migration-first10-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dzen-migration-first10-20261104
          persist-credentials: true
      - name: Install image verification tools
        run: python3 -m pip install pillow
      - name: Download source art from matched public Dzen articles (NO PUBLICATION)
        run: python3 research/download_dzen_covers.py
      - name: Archive cover report and thumbnails on research branch
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/imported/ research/dzen_cover_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: restore original Dzen article cover images'
            git push origin HEAD:research/dzen-migration-first10-20261104
          fi
