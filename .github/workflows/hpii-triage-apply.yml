name: HPII — historical triage hot priority tests (NO PUBLICATION)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/triage_apply_priorities.py'
      - '.github/workflows/hpii-triage-apply.yml'
permissions:
  contents: read
concurrency:
  group: hpii-triage-priority-apply
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 scripts/site_news_pool.py --validate
          python3 scripts/editorial_routing.py --validate
          python3 scripts/triage_apply_priorities.py
