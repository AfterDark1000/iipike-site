name: HPII admin unified GitHub login UI checks (NO PUBLICATION)

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/index.html'
      - 'admin/auto-editor/**'
      - 'admin/auto-corrector/**'
      - 'tests/auto-corrector-picker.test.mjs'
      - 'admin/pool/**'
      - 'tests/pool-view.test.mjs'
      - 'admin/commenting/**'
      - 'admin/auth/**'
      - '.github/workflows/hpii-admin-ui-safety.yml'

permissions:
  contents: read

jobs:
  check-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all scripts, verify common auth gate and review API
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/auth/gate.js
          node --check admin/auth/hpii-auth-client.js
          node --check admin/commenting/app.js
          node --check admin/pool/app.js
          node --check admin/pool/pool-data.mjs
          node --test tests/pool-view.test.mjs
          node --test tests/auto-editor-queue.test.mjs
          node --test tests/auto-corrector-picker.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ['admin/index.html', 'admin/auto-editor/index.html', 'admin/auto-corrector/index.html', 'admin/commenting/index.html', 'admin/pool/index.html']:
              html=Path(name).read_text(encoding='utf-8')
              assert 'src="/admin/auth/gate.js"' in html, name
              assert 'html:not(.hpii-authorized)' in html, name
              for script in re.findall(r'<script>(.*?)</script>', html, flags=re.S):
                  subprocess.run(['node', '--check'], input=script, text=True, check=True)
          pool=Path('admin/pool/index.html').read_text(encoding='utf-8')
          assert 'src="/admin/pool/app.js"' in pool
          assert 'href="/admin/pool/"' in Path('admin/index.html').read_text(encoding='utf-8')
          auto=Path('admin/auto-editor/index.html').read_text(encoding='utf-8')
          assert 'window.HpiiAdminAuth.review(doc,action,note.value.trim())' in auto
          assert 'window.open(url' not in auto
          # Cover approval feedback must remain visible where the user just clicked,
          # and remain visible at the top after reloading a previously approved cover.
          cover_start=auto.index('async function showCoverReviewControls(')
          cover_end=auto.index('async function showCoverCandidate(',cover_start)
          ui=auto[cover_start:cover_end]
          assert ui.index('const p=add(wrap,"p"')>ui.index('const redo=add(actions,"button"'), 'Result belongs below action buttons'
          assert 'p.setAttribute("aria-live","polite")' in ui
          assert 'topState.textContent=message' in ui
          assert 'actions.hidden=true' in ui
          assert 'result.status==="cover_approved_handoff_pending"' in ui
          assert 'void showCoverReviewControls(doc,cover,region,image,topState)' in auto
          assert 'coverState=add(detail,"p"' in auto
          assert 'hpii-admin-authorized' in auto
          assert 'hpii-admin-authorized' in Path('admin/index.html').read_text(encoding='utf-8')
          assert 'hpii-admin-authorized' in Path('admin/commenting/app.js').read_text(encoding='utf-8')
          print('Admin gate, code parsing and authenticated actions: OK')
          PY
