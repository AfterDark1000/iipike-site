name: HPII admin unified GitHub login UI checks (NO PUBLICATION)

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/index.html'
      - 'admin/auto-editor/**'
      - 'admin/commenting/**'
      - 'admin/auth/**'
      - '.github/workflows/hpii-admin-ui-safety.yml'

permissions:
  contents: read

jobs:
  check-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all scripts, verify common auth gate and review API
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/auth/gate.js
          node --check admin/auth/hpii-auth-client.js
          node --check admin/commenting/app.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ['admin/index.html', 'admin/auto-editor/index.html', 'admin/commenting/index.html']:
              html=Path(name).read_text(encoding='utf-8')
              assert 'src="/admin/auth/gate.js"' in html, name
              assert 'html:not(.hpii-authorized)' in html, name
              for script in re.findall(r'<script>(.*?)</script>', html, flags=re.S):
                  subprocess.run(['node', '--check'], input=script, text=True, check=True)
          auto=Path('admin/auto-editor/index.html').read_text(encoding='utf-8')
          assert 'window.HpiiAdminAuth.review(doc,action,note.value.trim())' in auto
          assert 'window.open(url' not in auto
          assert 'hpii-admin-authorized' in auto
          assert 'hpii-admin-authorized' in Path('admin/index.html').read_text(encoding='utf-8')
          assert 'hpii-admin-authorized' in Path('admin/commenting/app.js').read_text(encoding='utf-8')
          print('Admin gate, code parsing and authenticated actions: OK')
          PY
