name: HPII — sync verified Dzen crosslinks (NO PUBLICATION)
on:
  # New articles published in Dzen must not wait days for the site's index.
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_editorial_catalog_snapshot.py'
      - '.github/workflows/sync-editorial-catalog.yml'
permissions:
  contents: write
concurrency:
  group: hpii-verified-dzen-catalog-sync
  cancel-in-progress: false
jobs:
  refresh-verified-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh only verified historical Dzen link evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_editorial_catalog_snapshot.py --write
      - name: Check provenance and regression before committing
        run: |
          python3 -m unittest discover -s tests -p 'test_sync_editorial_catalog_snapshot.py' -v
          python3 -m unittest discover -s tests -p 'test_site_publication_queue.py' -v
      - name: Commit metadata only; never change articles or trigger publication
        run: |
          set -euo pipefail
          if git diff --quiet -- data/editorial_full_catalog_snapshot.json; then
            echo "Verified catalog unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/editorial_full_catalog_snapshot.json
          git diff --cached --name-only | grep -qx 'data/editorial_full_catalog_snapshot.json'
          git commit -m 'chore: sync verified Dzen link evidence [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "Updated verified link catalog; no editorial release requested."
