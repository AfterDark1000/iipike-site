name: Validate HPII front page (NO PUBLICATION)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'news.json'
      - 'scripts/build_sitemap.py'
      - 'scripts/publish_approved_article.py'
      - 'scripts/site_related.py'
      - 'scripts/site_rubrics.py'
      - 'scripts/site_home.py'
      - 'scripts/build_home_published.py'
      - 'scripts/build_rubrics.py'
      - 'scripts/suggest_related.py'
      - 'data/editorial_full_catalog_snapshot.json'
      - 'rubrics/**'
      - 'tests/test_site_rubrics_related.py'
      - 'content/approved/**'
      - 'articles/index.html'
      - 'tests/test_approved_publisher.py'
      - 'tests/test_historical_batch.py'
      - 'tests/test_archival_batch3.py'
      - 'tests/test_archival_batch4.py'
      - 'tests/test_archival_batch5.py'
      - 'tests/test_search_indexing.py'
      - 'assets/site.css'
      - 'tests/test_homepage.py'
      - 'assets/social-footer.js'
      - 'tests/test_social_footer.py'
      - 'registry/index.html'
      - 'articles/**/index.html'
      - 'drafts/**/index.html'
      - 'scripts/publish_draft_preview.py'
      - '.github/workflows/homepage-safety.yml'
permissions:
  contents: read
jobs:
  homepage-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate homepage markup, dependencies and inline JavaScript
        run: |
          python3 -m unittest discover -s tests -p 'test_homepage.py' -v
          python3 -m unittest discover -s tests -p 'test_social_footer.py' -v
          python3 scripts/build_rubrics.py --check
          python3 scripts/build_home_published.py --check
          python3 scripts/build_sitemap.py --check
          python3 -m unittest discover -s tests -p 'test_site_rubrics_related.py' -v
          python3 -m unittest discover -s tests -p 'test_search_indexing.py' -v
          python3 -m unittest discover -s tests -p 'test_approved_publisher.py' -v
          python3 -m unittest discover -s tests -p 'test_historical_batch.py' -v
          python3 -m unittest discover -s tests -p 'test_archival_batch3.py' -v
          python3 -m unittest discover -s tests -p 'test_archival_batch4.py' -v
          python3 -m unittest discover -s tests -p 'test_archival_batch5.py' -v
      - name: Check desktop/mobile browser rendering
        run: |
          set -e
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "Chrome not available: skip visual screenshot"
            exit 0
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hpi-home-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 2
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1440,2450 --virtual-time-budget=3500 \
            --screenshot=homepage-desktop.png "http://127.0.0.1:8765/" >/tmp/hpi-chrome-desktop.log 2>&1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=390,2950 --virtual-time-budget=3500 \
            --screenshot=homepage-mobile.png "http://127.0.0.1:8765/" >/tmp/hpi-chrome-mobile.log 2>&1
          test -s homepage-desktop.png
          test -s homepage-mobile.png
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=390,2950 --virtual-time-budget=3500 \
            --screenshot=rubric-quotes-mobile.png "http://127.0.0.1:8765/rubrics/quotes/" >/tmp/hpi-chrome-rubric.log 2>&1
          test -s rubric-quotes-mobile.png
      - name: Preserve optional visual QA screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hpi-homepage-visual-qa
          path: |
            homepage-desktop.png
            homepage-mobile.png
            rubric-quotes-mobile.png
          if-no-files-found: ignore
          retention-days: 7
