name: HPII fourth batch retry missing Dzen original text (isolated)
on:
  push:
    branches: [archive/batch4-20261104]
    paths: ['.github/workflows/batch4-retry-text.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retry:
    if: github.ref == 'refs/heads/archive/batch4-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/batch4-20261104
          persist-credentials: true
      - name: Install read-only Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Retry only original articles with empty bodies
        run: python3 research/retry_batch4_text.py
      - name: Save verified source evidence on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/batch4_probe_results.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: recover missing complete original texts from Dzen'
            git pull --rebase origin archive/batch4-20261104
            git push origin HEAD:archive/batch4-20261104
          fi
      - name: Preserve source capture diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hpii-batch4-retried-text
          path: research/batch4_probe_results.json
          retention-days: 7
