name: HPI autonomous editorial previews (SITE DRAFTS ONLY)
on:
  workflow_dispatch:
  schedule:
    # Primary: 08:37 UTC+5; backups protect against missing GitHub cron events.
    # Idempotency in editorial_draft.py prevents a second daily draft.
    - cron: "37 3 * * *"
    - cron: "49 4 * * *"
    - cron: "11 6 * * *"
  push:
    branches: [main]
    paths:
      - 'scripts/editorial_draft.py'
      - 'scripts/publish_draft_preview.py'
      - 'scripts/flux_cover_probe.py'
      - 'tests/test_editorial_draft.py'
      - '.github/workflows/editorial-draft.yml'
permissions:
  contents: write
concurrency:
  group: hpi-editorial-draft
  cancel-in-progress: false
jobs:
  editorial-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image rendering
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Check code and editorial safeguards offline
        run: |
          python3 -m py_compile scripts/editorial_draft.py
          python3 -m unittest discover -v -s tests -p 'test_editorial_draft.py'
      - name: Prepare one sourced news draft and one FLUX cover (never publish)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.event.head_commit.message == 'Start missed daily draft after schedule fix') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/editorial_draft.py
      - name: Create labelled draft preview pages for existing public site
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.event.head_commit.message == 'Start missed daily draft after schedule fix')) && success() }}
        run: python3 scripts/publish_draft_preview.py
      - name: Keep draft and cover as a temporary GitHub Actions artifact
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.event.head_commit.message == 'Start missed daily draft after schedule fix')) && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: hpi-editorial-pilot
          path: _test_output/editorial/
          if-no-files-found: ignore
          retention-days: 21
      - name: Save previews and deduplication state to GitHub Pages repository
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.event.head_commit.message == 'Start missed daily draft after schedule fix')) && success() }}
        run: |
          if [ -n "$(git status --porcelain -- editorial_state.json editorial_status.json drafts/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add editorial_state.json editorial_status.json drafts/
            git commit -m "Save labelled HPI draft preview and source ID"
            git pull --rebase origin main
            git push
          fi
