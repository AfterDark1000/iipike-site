name: HPII — deploy admin gateway safely (not FLUX; no publication)

on:
  push:
    branches: [main]
    paths:
      - 'admin-auth-worker/src/index.mjs'
      - 'admin-auth-worker/wrangler.toml'
      - '.github/workflows/hpii-admin-gateway-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hpii-admin-gateway-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline gateway, OAuth and cover-revision tests
        run: |
          node --check admin-auth-worker/src/index.mjs
          node --test admin-auth-worker/tests/*.test.mjs
      - name: Check dedicated Cloudflare deployment credentials
        id: credentials
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_DEPLOY_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ] && [ -n "$ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Dedicated Cloudflare deploy credentials are present.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: gateway was NOT deployed. Configure CLOUDFLARE_ADMIN_DEPLOY_TOKEN (Workers Scripts Edit scoped to hpii-admin-gateway) and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. Never reuse FLUX inference token.' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::Admin Worker deployment not configured; gateway production remains untouched'
          fi
      - name: Deploy ONLY hpii-admin-gateway; retain Cloudflare OAuth runtime secrets
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ADMIN_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin-auth-worker
          command: deploy --keep-vars
      - name: Confirm live gateway API supports cover versions up to v5
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          target="https://hpii-admin-gateway.svuktablet.workers.dev/health"
          for attempt in range(5):
              try:
                  request=urllib.request.Request(target,headers={"User-Agent":"HPII-Gateway-Deploy-Healthcheck"})
                  with urllib.request.urlopen(request,timeout=10) as response:
                      payload=json.load(response)
                  if payload.get("ok") is True and payload.get("service")=="hpii-auth-gateway" and payload.get("cover_review_max_version")==5:
                      print("LIVE_GATEWAY_COVER_V2_TO_V5_READY")
                      break
              except Exception as exc:
                  print("Health check attempt failed:",type(exc).__name__)
              if attempt==4: raise SystemExit("Gateway was not verified as deployed; do not mark v2 API ready")
              time.sleep(3)
          PY
          echo 'DEPLOYED AND VERIFIED: live /health supports cover_review_max_version=5. Authorized owner review still required.' >> "$GITHUB_STEP_SUMMARY"
